<!doctype html>
<html lang="sv">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Marcus Johansson | Videopresentation</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#180d10;color:#fbf3e7}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at top,#51272b,transparent 65%),#180d10;display:grid;place-items:center;padding:clamp(18px,4vw,60px)}main{width:min(1100px,100%,max(300px,calc((100svh - 210px)*16/9)))}header{display:flex;align-items:center;gap:16px;margin-bottom:30px}.monogram{border:1px solid #c4a689;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;font-family:Georgia,serif;font-size:20px;color:#d9b996}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#d9b996;margin:0 0 6px}h1{font-family:Georgia,serif;font-size:clamp(27px,5vw,46px);font-weight:400;margin:0}.screen{position:relative;border:1px solid #8b605b;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 24px 80px #0006}video{width:100%;display:block;aspect-ratio:16/9}footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#cbbab3;font-size:13px;margin-top:22px}p{margin:0}a{color:#efd9bb;text-underline-offset:4px}a:focus-visible{outline:2px solid #efd9bb;outline-offset:6px}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid #efd9bb;background:#31171eeb;color:#fff7eb;padding:18px 24px;border-radius:99px;font:600 16px system-ui;cursor:pointer;box-shadow:0 6px 28px #0006;white-space:nowrap}.play:hover{background:#713941}.play:focus-visible{outline:3px solid #fff;outline-offset:5px}.play[hidden]{display:none}
.screen{border-color:#b0886e;box-shadow:0 0 0 5px #e9c89d10,0 24px 80px #0008}
.play{background:linear-gradient(120deg,#f4dfbf,#d5a673);color:#2a1418;border-color:#ffe8c4}
.play:hover{background:#ffe5bd;box-shadow:0 6px 36px #e9c89d80}
@media(prefers-reduced-motion:no-preference){
 header,.screen,footer{animation:arrive .55s ease-out both}
 .screen{animation-delay:.10s}
 footer{animation-delay:.18s}
 .play{transition:background .2s,box-shadow .2s,transform .2s}
 .play:hover{transform:translate(-50%,-50%) scale(1.04)}
 @keyframes arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
}
</style>
<main><header><span class="monogram" aria-hidden="true">MJ</span><div><p class="eyebrow">En personlig presentation</p><h1>Marcus Johansson</h1></div></header>
<div class="screen"><video controls controlslist="nodownload" playsinline preload="metadata" poster="poster.jpg" aria-label="Marcus Johanssons presentation för 3 Glada Hjärtan"><source src="video.mp4" type="video/mp4">Din webbläsare kan inte spela videon.</video><button class="play" id="play" hidden>▶ Spela presentationen</button></div>
<footer><p>Presentation för 3 Glada Hjärtan · cirka 30 sekunder</p></footer></main><script>
const video=document.querySelector('video'),button=document.getElementById('play');
button.hidden=false;
button.addEventListener('click',async()=>{try{await video.play();button.hidden=true}catch{button.textContent='Försök spela igen'}});
video.addEventListener('playing',()=>button.hidden=true);
video.addEventListener('ended',()=>{button.hidden=false;button.textContent='▶ Spela igen'});
</script></html>
